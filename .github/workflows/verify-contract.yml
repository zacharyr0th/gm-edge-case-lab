name: Verify contract

# The matrix asserts structural facts about Ondo's published API. Those claims
# rot silently when the spec moves, so re-check them on a schedule as well as
# on change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Verify claims against the live OpenAPI spec
        run: bun run verify:contract
